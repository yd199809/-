<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <button id="flagBtn">update flag</button>
    <button id="nameBtn">update name</button>
    <button id="ageBtn">Unflag</button>
  </body>
  <script type="module">
    import { ref, effect } from "../dist/reactivity.esm.js";
    const flag = ref(true);
    const name = ref("一丁");
    const age = ref(18);

    let count = 0;

    const e = effect(() => {
      console.count("effect");
      // if (count > 0) return;
      // count++;
      if (flag.value) {
        app.innerHTML = name.value;
      } else {
        app.innerHTML = age.value;
      }
    });

    flagBtn.onclick = () => {
      flag.value = !flag.value;
      console.dir(e);
    };

    nameBtn.onclick = () => {
      name.value = name.value + Math.random();
    };

    ageBtn.onclick = () => {
      age.value++;
    };
  </script>
</html>
