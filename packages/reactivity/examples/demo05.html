<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <style>
      body {
        padding: 150px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      //   import {
      //     reactive,
      //     effect,
      //   } from "../../../node_modules/vue/dist/vue.esm-browser.prod.js";
      import { reactive, effect, ref } from "../dist/reactivity.esm.js";
      // 如果 target.a 是一个 ref 就直接把值赋给它，不要让它.value
      // 如果更新了 state.a 就会修改原始的 ref.value 的值 就是newValue
      // 如果 newValue 是一个 ref 那就算了
      const a = ref(0);

      const state = reactive({
        a: {
          b: 0,
        },
      });

      effect(() => {
        console.log(state.a.b);
      });

      setTimeout(() => {
        state.a = { b: 1 };
      }, 1000);
    </script>
  </body>
</html>
